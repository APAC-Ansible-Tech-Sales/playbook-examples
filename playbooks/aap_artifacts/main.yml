---
- name: Show stats in the AAP UI
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Gather storage capacity
      shell: |
        df -h --total | awk '
        NR==1 {next}
        /total/ {
          printf "Total: %s  Used: %s  Free: %s  (%s)\n", $2, $3, $4, $5
        }'
      register: storageusage
  
    - name: Gather list of users
      command: cat /etc/passwd
      register: userlist
    
    - name: Show storage usage
      ansible.builtin.debug:
        var: storageusage.stdout_lines

    - name: Show user list
      ansible.builtin.debug:
        var: userlist.stdout_lines
    
    - name: Publish stats for AAP Artifacts
      ansible.builtin.set_stats:
        data:
          storage_usage: "{{ storageusage.stdout }}"
          users: "{{ userlist.stdout_lines }}"
        aggregate: false